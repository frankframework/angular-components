<div
  class="ff-alert flex w-full px-5 py-3 border-t border-r border-b border-l-6 border-solid rounded-md items-center justify-center gap-2 text-base font-semibold"
  [ngClass]="className()"
>
  @switch (type()) {
    @case ('info') {
      <svg solarInfoCircle color="#037CD4" [size]="iconSize" />
    }
    @case ('success') {
      <svg solarCheckCircle color="#00d841" [size]="iconSize" />
    }
    @case ('error') {
      <svg solarCloseCircle color="#DA0004" [size]="iconSize" />
    }
    @default {
      <svg solarDangerCircle color="#d89400" [size]="iconSize" />
    }
  }
  <span class="flex-[1_1_100%]"><ng-content /></span>
</div>
