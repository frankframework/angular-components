<label class="inline-flex w-full" tabindex="0" (click)="_onClick($event)">
  <span class="flex-1"><ng-content /></span>
  <input
    class="w-4.5 h-4.5 border border-solid border-[#B2B2B2] rounded accent-active"
    type="checkbox"
    [disabled]="isDisabled()"
    [ffAutoFocus]="autofocus()"
    [ngModel]="isChecked()"
    (ngModelChange)="updateValue($event)"
    (blur)="_onBlur()"
  />
</label>
